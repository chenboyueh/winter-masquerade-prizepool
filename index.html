<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上抽獎系統 - 參與頁面</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md text-center" id="app">
    <div id="loading" class="text-gray-500 font-medium py-8">載入狀態中...</div>

    <!-- 狀態 1：未開啟抽獎 -->
    <div id="state-closed" class="hidden">
      <div class="text-4xl mb-4">🚫</div>
      <h2 class="text-2xl font-bold text-gray-800">現在不可參加抽獎！</h2>
      <p class="text-gray-500 mt-2">請等待主持人開啟抽獎活動。</p>
    </div>

    <!-- 狀態 2：填寫資料 -->
    <div id="state-active" class="hidden text-left">
      <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">請輸入抽獎資訊</h2>
      <form id="lottery-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">學校</label>
          <input type="text" id="school" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm border p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">系級</label>
          <input type="text" id="dept" placeholder="例如：資工三" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm border p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">名字</label>
          <input type="text" id="name" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm border p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">學號</label>
          <input type="text" id="studentId" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm border p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-indigo-700 transition">送出抽獎資料</button>
      </form>
    </div>

    <!-- 狀態 3：已報名，等待公布 -->
    <div id="state-submitted" class="hidden">
      <div class="text-5xl mb-4">⏳</div>
      <h2 class="text-2xl font-bold text-gray-800">等待主持人公布獎池...</h2>
      <p class="text-gray-500 mt-2">資料已成功送出，請保持頁面開啟。</p>
    </div>

    <!-- 狀態 4：公布結果 -->
    <div id="state-announced" class="hidden">
      <div class="text-5xl mb-4">🎉</div>
      <h2 class="text-2xl font-bold text-indigo-600 mb-2">看看你的名字有沒有在畫面上！</h2>
      <p class="text-sm text-gray-500 mb-4">中獎名單：</p>
      <div id="winner-list" class="space-y-2 max-h-60 overflow-y-auto p-2 border rounded-lg bg-gray-50"></div>
    </div>
  </div>

  <script>
    // 1. 請在此替換為你的 Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyCgxkaaXkHxkm2lPE-hifRznTsty5ZZPoA",
      authDomain: "winter-masquerade-prizep-d97ab.firebaseapp.com",
      databaseURL: "https://winter-masquerade-prizep-d97ab-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "winter-masquerade-prizep-d97ab",
      storageBucket: "winter-masquerade-prizep-d97ab.firebasestorage.app",
      messagingSenderId: "821551153470",
      appId: "1:821551153470:web:e010353552c875a7202c6f",
      measurementId: "G-LF60DNKXKR"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let hasSubmitted = localStorage.getItem('lottery_submitted') === 'true';

    // UI 切換邏輯
    function showState(stateName) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('state-closed').classList.add('hidden');
      document.getElementById('state-active').classList.add('hidden');
      document.getElementById('state-submitted').classList.add('hidden');
      document.getElementById('state-announced').classList.add('hidden');

      document.getElementById(`state-${stateName}`).classList.remove('hidden');
    }

    // 監聽狀態變更
    db.ref('draw_state').on('value', (snapshot) => {
      const data = snapshot.val() || { status: 'closed' };

      if (data.status === 'closed') {
        localStorage.removeItem('lottery_submitted');
        hasSubmitted = false;
        showState('closed');
      } else if (data.status === 'active') {
        if (hasSubmitted) {
          showState('submitted');
        } else {
          showState('active');
        }
      } else if (data.status === 'announced') {
        showState('announced');
        renderWinners(data.winners || []);
      }
    });

    // 表單送出
    document.getElementById('lottery-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const school = document.getElementById('school').value.trim();
      const dept = document.getElementById('dept').value.trim();
      const name = document.getElementById('name').value.trim();
      const studentId = document.getElementById('studentId').value.trim();

      // 以學號作為 Key，避免重複報名
      db.ref('participants/' + studentId).set({
        school, dept, name, studentId, timestamp: Date.now()
      }).then(() => {
        localStorage.setItem('lottery_submitted', 'true');
        hasSubmitted = true;
        showState('submitted');
      }).catch(err => alert("送出失敗：" + err.message));
    });

    // 渲染中獎者名單
    function renderWinners(winners) {
      const container = document.getElementById('winner-list');
      container.innerHTML = '';
      if (winners.length === 0) {
        container.innerHTML = '<div class="text-gray-400">本次無中獎人</div>';
        return;
      }
      winners.forEach(w => {
        const item = document.createElement('div');
        item.className = 'p-2 bg-white rounded shadow-sm font-semibold text-gray-700 flex justify-between';
        item.innerHTML = `<span>${w.dept}</span><span>${w.name}</span>`;
        container.appendChild(item);
      });
    }
  </script>
</body>
</html>
